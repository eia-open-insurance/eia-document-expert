server:
  port: 8095
spring:
  application:
    name: eia-document-expert
  datasource:
    url: jdbc:postgresql://localhost:5432/eia_document
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
  quartz:
    # Quartz hosts both the outbox dispatcher and the retention disposition
    # job, so it must start whenever either feature is enabled. Jobs are only
    # registered by their own @ConditionalOnProperty configurations.
    auto-startup: ${EIA_QUARTZ_AUTO_STARTUP:true}
    job-store-type: memory
management:
  endpoints:
    web:
      exposure:
        include: health,info
eia:
  outbox:
    enabled: ${EIA_OUTBOX_ENABLED:false}
    endpoint: ${EIA_OUTBOX_ENDPOINT:}
    batch-size: ${EIA_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${EIA_OUTBOX_MAX_ATTEMPTS:12}
    claim-lease: ${EIA_OUTBOX_CLAIM_LEASE:2m}
    interval: ${EIA_OUTBOX_INTERVAL:2s}
    signing-secret: ${EIA_OUTBOX_SIGNING_SECRET:}
  document:
    retention:
      # Automatic disposition is opt-in. When enabled, the Quartz job scans
      # due documents daily at 02:00 UTC and disposes at most batch-size per run.
      enabled: ${EIA_DOCUMENT_RETENTION_ENABLED:false}
      cron: "${EIA_DOCUMENT_RETENTION_CRON:0 0 2 * * ?}"
      batch-size: ${EIA_DOCUMENT_RETENTION_BATCH_SIZE:100}
      actor-id: ${EIA_DOCUMENT_RETENTION_ACTOR_ID:00000000-0000-0000-0000-000000000000}

